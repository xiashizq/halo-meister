[package]
name = "halomeister-tagmod-exporter"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "halomeister-tagmod-exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
blam-tags = { git = "https://github.com/camden-smallwood/blam-tags", rev = "1c3ad0c", features = ["iostore"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
